[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adsenseready-ai"
version = "2026.11.3"
description = "7-pillar Google AdSense readiness audit CLI and MCP server for blogs, SaaS, and docs"
readme = "README.md"
authors = [
    { name = "Oathan Rex", email = "oathanrex@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "adsense",
    "google-adsense",
    "ai-skill",
    "seo-audit",
    "publisher-policies",
    "mcp-server",
    "model-context-protocol",
    "claude-code",
    "antigravity",
    "eeat"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Quality Assurance"
]
dependencies = [
    "rich>=13.0.0"
]

[project.urls]
Homepage = "https://github.com/oathanrex/adsenseready-ai"
Documentation = "https://github.com/oathanrex/adsenseready-ai#readme"
Repository = "https://github.com/oathanrex/adsenseready-ai.git"
Issues = "https://github.com/oathanrex/adsenseready-ai/issues"

[project.scripts]
adsense-audit = "src.cli:main"
adsenseready-mcp = "src.mcp_server:main"

[tool.setuptools]
packages = ["src", "src.checkers", "policies", "scripts"]

[tool.setuptools.package-data]
policies = ["*.json"]
