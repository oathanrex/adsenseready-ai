name: Release & Publish to PyPI

# Push a v* tag (e.g. v2026.11.3) to:
#   1. create a GitHub Release with generated release notes
#   2. build sdist + wheel
#   3. publish to PyPI using OIDC Trusted Publishing (no token in the repo)
#
# One-time setup on PyPI:
#   Account settings -> Publishing -> Add a new trusted publisher:
#     Owner: oathanrex
#     Repository: adsenseready-ai
#     Workflow: publish.yml
#     Environment: pypi
#     Package name: adsenseready-ai
#
# See docs/RELEASING.md for the full checklist.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create release from tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}

  publish:
    name: Build and publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/adsenseready-ai
    permissions:
      contents: read
      id-token: write  # mandatory for PyPI Trusted Publishing
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
